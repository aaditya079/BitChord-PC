[package]
name = "bitchord-core"
version = "0.1.0"
edition = "2021"
authors = ["Aaditya Srinivasan <aaditya@bitchord.org>", "BitChord Contributors"]
description = "High-performance streaming audio engine and YouTube Innertube client"
license = "GPL-3.0-only"

[dependencies]
# Async & Networking
tokio = { version = "1.42", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
bytes = "1.9"
url = "2.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Audio Pipeline
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.15"
rtrb = "0.3"

# Challenge Solver & Regex
regex = "1.11"
boa_engine = "0.20"

# Logging & Error Handling
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
